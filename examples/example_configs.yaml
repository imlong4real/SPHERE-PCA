# Per-dataset parameters extracted from the example notebooks. Used by
# scripts/run_pnas_hypothesis_suite.py and the Streamlit app to keep
# dataset-specific knobs out of code. Edit here, not in source.
#
# Required fields per dataset:
#   csv:                  path to the input CSV (PC1, PC2, PC3 + label).
#   label_column:         per-cell categorical label.
#   root_column:          column used to pick the root cluster.
#   root_value:           value in root_column whose centroid -> north pole.
#   euler_angles:         [x, y, z] degrees for apply_euler_rotation.
#
# Optional fields:
#   pseudotime_column:    column used as ordinal pseudotime (string mapped
#                         via lineage_orderings or, for celegan, parsed
#                         from "{lo}-{hi}" embryo-time bins).
#   pseudotime_parser:    "embryo_time_bin" for celegan-style "lo-hi" labels;
#                         "ordinal" (default) for category-rank.
#   lineage_orderings:    dict of named lineages, each a list of cell
#                         types in temporal order. Used for theta-vs-
#                         pseudotime correlation (per-lineage).
#   stripe_ranges:        list of [lon_min_deg, lon_max_deg] pairs.
#   candidate_roots:      additional root values to sweep for sensitivity.

celegan:
  csv: examples/celegan_pca.csv
  label_column: celltype
  root_column: cluster
  root_value: "100-130"
  euler_angles: [-30, 0, -50]
  pseudotime_column: cluster
  pseudotime_parser: embryo_time_bin
  stripe_ranges:
    - [-110, -10]    # Stripe 1 (lon -60 +/- 50)
    - [   0,  60]    # Stripe 2 (lon  30 +/- 30)
    - [  80, 120]    # Stripe 3 (lon 100 +/- 20)
    - [ 130, 170]    # Stripe 4 (lon 150 +/- 20)
  candidate_roots:
    - "100-130"
    - "130-170"
    - "170-210"

planaria:
  csv: examples/planaria_pca.csv
  label_column: celltype
  root_column: celltype
  root_value: "neoblast 1"
  euler_angles: [80, 50, 50]
  lineage_orderings:
    gut: ["neoblast 1", "gut progenitors", "phagocytes"]
    muscle: ["neoblast 1", "muscle progenitors", "muscle body", "muscle pharynx"]
    parenchyma: ["neoblast 1", "parenchymal progenitors", "ldlrr-1+ parenchymal cells",
                 "pgrn+ parenchymal cells", "glia"]
    neural_chat: ["neoblast 1", "neural progenitors", "ChAT neurons 1", "ChAT neurons 2"]
    neural_gaba: ["neoblast 1", "neural progenitors", "cav-1+ neurons", "GABA neurons"]
  candidate_roots:
    - "neoblast 1"
    - "neoblast 2"
    - "neural progenitors"

uc_epi:
  csv: examples/uc_epi_pca.csv
  label_column: celltype
  root_column: celltype
  root_value: "Stem"
  euler_angles: [-90, -50, 50]
  lineage_orderings:
    enterocyte: ["Stem", "TA 2", "Immature Enterocytes 2", "Enterocytes"]
    goblet:     ["Stem", "Secretory TA", "Immature Goblet", "Goblet"]
  candidate_roots:
    - "Stem"
    - "TA 2"
    - "Secretory TA"

klein:
  csv: examples/klein_pca.csv
  label_column: cluster
  root_column: cluster
  root_value: "Day0"
  euler_angles: [30, 0, 0]
  lineage_orderings:
    day_progression: ["Day0", "Day2", "Day4", "Day7"]
  candidate_roots:
    - "Day0"
    - "Day2"
